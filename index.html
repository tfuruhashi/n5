<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>Yappanese N5 判定テスト</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --navy:#1f3864; --ink:#1a1a1a; --sub:#6b7280; --line:#e5e7eb;
  --bg:#ffffff; --soft:#f7f8fa; --ok:#1e6b38; --okbg:#e6f4ea;
  --ng:#9b2c2c; --ngbg:#fdeaea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.75;
  font-size:17px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px;
      min-height:100dvh;display:flex;flex-direction:column}
.hide{display:none !important}

h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
.lead{color:var(--sub);font-size:14px;margin:0 0 24px}

label{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px}
input[type=text]{
  width:100%;padding:14px;font:inherit;border:1px solid var(--line);
  border-radius:10px;background:var(--soft)
}
input[type=text]:focus{outline:2px solid var(--navy);outline-offset:-1px}

button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn{
  width:100%;padding:16px;background:var(--navy);color:#fff;
  font-weight:600;font-size:17px;margin-top:20px
}
.btn:disabled{opacity:.35;cursor:default}
.btn.sub{background:#fff;color:var(--navy);border:1px solid var(--navy);
         padding:12px;font-size:15px;margin-top:10px}

/* 進行バー */
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar>i{display:block;height:100%;background:var(--navy);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;
      color:var(--sub);margin-bottom:20px}
.tag{background:var(--soft);padding:2px 10px;border-radius:99px;font-size:12px}

/* 問題 */
.passage{
  background:var(--soft);border-radius:12px;padding:16px;
  margin-bottom:18px;white-space:pre-wrap;font-size:16px
}
.qtext{font-size:19px;font-weight:600;margin:0 0 20px;line-height:1.8}
.qtext u{text-decoration:none;border-bottom:3px solid var(--navy);padding-bottom:1px}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:16px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;font-size:17px;color:var(--ink)
}
.choice:active{background:var(--soft)}
.choice.sel{border-color:var(--navy);background:#eef2fa}
.choice .n{
  flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);
  color:var(--sub);display:grid;place-items:center;font-size:14px;font-weight:600
}
.choice.sel .n{background:var(--navy);color:#fff}

/* 聴解 */
.audio{
  background:#eef2fa;border:1px solid #c9d5ea;border-radius:12px;
  padding:18px;text-align:center;margin-bottom:18px
}
.audio .ic{font-size:28px}
.play{
  margin-top:10px;padding:12px 26px;background:var(--navy);color:#fff;
  font-size:16px;font-weight:600
}
.play:disabled{opacity:.4}
.left{font-size:13px;color:var(--sub);margin-top:8px}

/* 結果 */
.score{text-align:center;padding:28px 0 20px}
.score .n{font-size:56px;font-weight:700;line-height:1;color:var(--navy)}
.score .d{font-size:15px;color:var(--sub);margin-top:6px}
.verdict{
  display:inline-block;margin-top:16px;padding:10px 28px;
  border-radius:99px;font-weight:700;font-size:18px
}
.verdict.p{background:var(--okbg);color:var(--ok)}
.verdict.f{background:var(--ngbg);color:var(--ng)}

.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:22px}
.row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
     font-size:14px;align-items:flex-start}
.row:last-child{border-bottom:none}
.row .i{flex:0 0 22px;font-weight:700}
.row.o .i{color:var(--ok)} .row.x .i{color:var(--ng)}
.row .t{flex:1;min-width:0}
.row .t small{color:var(--sub);display:block;margin-top:2px}

.note{font-size:13px;color:var(--sub);margin-top:22px;
      background:var(--soft);padding:14px;border-radius:10px}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;
    font-size:11px;overflow:auto;margin:10px 0 0;line-height:1.6}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;
  font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9
}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 開始 ============ -->
<section id="start">
  <h1>N5 判定テスト</h1>
  <p class="lead">日本語能力を確認します。10問・約10分</p>

  <label for="name">受験者の名前 / Name</label>
  <input type="text" id="name" placeholder="例：Ram Bahadur" autocomplete="name">

  <label for="school">実施機関 / Institution</label>
  <input type="text" id="school" placeholder="例：○○日本語学校">

  <div class="note">
    <b>この形式について</b><br>
    実際のJLPT N5の構成比に合わせています。<br>
    ・文字語彙 3問／文法 2問／読解 2問／<b>聴解 3問</b><br>
    ・合格ライン 5問正解<br>
    聴解は音が出ます。音量を確認してください。
  </div>

  <button class="btn" id="go">はじめる / Start</button>
</section>

<!-- ============ 出題 ============ -->
<section id="quiz" class="hide">
  <div class="bar"><i id="prog"></i></div>
  <div class="meta">
    <span id="count"></span>
    <span class="tag" id="kind"></span>
  </div>

  <div id="audioBox" class="audio hide">
    <div class="ic">🔊</div>
    <button class="play" id="play">音声を聞く</button>
    <div class="left" id="left"></div>
  </div>

  <div id="passage" class="passage hide"></div>
  <p class="qtext" id="qtext"></p>
  <div class="choices" id="choices"></div>

  <button class="btn" id="next" disabled>つぎへ / Next</button>
</section>

<!-- ============ 結果 ============ -->
<section id="result" class="hide">
  <h1>結果</h1>
  <p class="lead" id="who"></p>

  <div class="score">
    <div class="n"><span id="sc">0</span> <span style="font-size:26px;color:#9aa3af">/ 10</span></div>
    <div class="d">正答数</div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="rows" id="rows"></div>

  <div class="note">
    <b>入管提出用の記録</b><br>
    下のJSONをコピーし、各種確認書に転記してください。<br>
    使用ツール・出題数・正答数・合否基準が含まれます。
  </div>
  <pre id="json"></pre>
  <button class="btn" id="copy">記録をコピー</button>
  <button class="btn sub" id="again">もう一度</button>
</section>

</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const KIND = {vocab:'文字・語彙', grammar:'文法', reading:'読解', listening:'聴解'};
const DIST = {vocab:3, grammar:2, reading:2, listening:3};
const PASS = 5;
const TOOL = 'Yappanese N5 判定テスト v1.0';

let POOL = [], quiz = [], idx = 0, picked = null, plays = 0, answers = [];

// ---------- 起動 ----------
fetch('questions.json')
  .then(r => r.json())
  .then(d => { POOL = d.questions; })
  .catch(() => toast('問題の読み込みに失敗しました'));

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 分野ごとにプールから抽出し、選択肢もシャッフルする
// （問題データは正解が常に0番のため、シャッフルは必須）
function build(){
  const out = [];
  for (const [type, n] of Object.entries(DIST)){
    const cand = shuffle(POOL.filter(q => q.type === type)).slice(0, n);
    out.push(...cand);
  }
  return shuffle(out).map(q => {
    const pairs = q.choices.map((c, i) => ({c, ok: i === q.answer}));
    const sh = shuffle(pairs);
    return {...q, choices: sh.map(p => p.c), answer: sh.findIndex(p => p.ok)};
  });
}

function toast(msg){
  $('toast').textContent = msg;
  $('toast').classList.add('on');
  setTimeout(() => $('toast').classList.remove('on'), 1800);
}

// ---------- 開始 ----------
$('go').onclick = () => {
  if (!$('name').value.trim()) { toast('名前を入れてください'); return; }
  if (!POOL.length) { toast('問題を読み込み中です'); return; }
  quiz = build(); idx = 0; answers = [];
  $('start').classList.add('hide');
  $('quiz').classList.remove('hide');
  render();
};

// ---------- 出題 ----------
function render(){
  const q = quiz[idx];
  picked = null; plays = 0;

  $('prog').style.width = (idx / quiz.length * 100) + '%';
  $('count').textContent = `問 ${idx + 1} / ${quiz.length}`;
  $('kind').textContent = KIND[q.type];

  // 聴解
  if (q.type === 'listening'){
    $('audioBox').classList.remove('hide');
    $('play').disabled = false;
    $('left').textContent = '2回まで聞けます';
  } else {
    $('audioBox').classList.add('hide');
    speechSynthesis.cancel();
  }

  // 本文
  if (q.passage){
    $('passage').classList.remove('hide');
    $('passage').textContent = q.passage;
  } else {
    $('passage').classList.add('hide');
  }

  // 設問（下線部を強調）
  let t = q.q;
  if (q.underline) t = t.replace(q.underline, `<u>${q.underline}</u>`);
  $('qtext').innerHTML = t;

  // 選択肢
  $('choices').innerHTML = '';
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="n">${i + 1}</span><span>${c}</span>`;
    b.onclick = () => {
      picked = i;
      [...$('choices').children].forEach((e, j) =>
        e.classList.toggle('sel', j === i));
      $('next').disabled = false;
    };
    $('choices').appendChild(b);
  });

  $('next').disabled = true;
  $('next').textContent = (idx === quiz.length - 1)
    ? '結果を見る / Finish' : 'つぎへ / Next';
  window.scrollTo(0, 0);
}

// ---------- 音声 ----------
$('play').onclick = () => {
  const q = quiz[idx];
  if (plays >= 2) return;
  plays++;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(q.audio);
  u.lang = 'ja-JP';
  u.rate = 0.85;
  u.onend = () => {
    $('left').textContent = plays >= 2 ? '再生は終わりです' : 'あと1回聞けます';
    $('play').disabled = plays >= 2;
  };
  $('play').disabled = true;
  $('left').textContent = '再生中…';
  speechSynthesis.speak(u);
};

// ---------- 次へ ----------
$('next').onclick = () => {
  const q = quiz[idx];
  answers.push({
    id: q.id, type: q.type, sub: q.sub,
    picked, correct: picked === q.answer,
    q: q.q, chosen: q.choices[picked], right: q.choices[q.answer]
  });
  speechSynthesis.cancel();
  idx++;
  if (idx < quiz.length) render(); else finish();
};

// ---------- 結果 ----------
function finish(){
  const n = answers.filter(a => a.correct).length;
  const pass = n >= PASS;

  $('quiz').classList.add('hide');
  $('result').classList.remove('hide');
  $('who').textContent =
    `${$('name').value.trim()}　${$('school').value.trim()}`;
  $('sc').textContent = n;
  $('verdict').textContent = pass ? '合格 / Pass' : '不合格 / Not yet';
  $('verdict').className = 'verdict ' + (pass ? 'p' : 'f');

  $('rows').innerHTML = '';
  answers.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'row ' + (a.correct ? 'o' : 'x');
    d.innerHTML = `<span class="i">${a.correct ? '○' : '×'}</span>
      <span class="t">${i + 1}. ${KIND[a.type]}（${a.sub}）
      ${a.correct ? '' : `<small>正解：${a.right}／選択：${a.chosen}</small>`}</span>`;
    $('rows').appendChild(d);
  });

  const rec = {
    使用ツール: TOOL,
    実施日時: new Date().toLocaleString('ja-JP'),
    受験者: $('name').value.trim(),
    実施機関: $('school').value.trim(),
    出題数: quiz.length,
    正答数: n,
    合否基準: `${quiz.length}問中${PASS}問以上の正答`,
    判定: pass ? '合格' : '不合格',
    内訳: Object.fromEntries(Object.keys(DIST).map(k => {
      const g = answers.filter(a => a.type === k);
      return [KIND[k], `${g.filter(a => a.correct).length}/${g.length}`];
    })),
    各問の正誤: answers.map((a, i) =>
      `${i + 1}.${KIND[a.type]}:${a.correct ? '○' : '×'}`).join(' '),
    備考: 'JLPT公式問題ではない。JLPT N5の出題形式と難易度に準拠して作成した自作の評価ツール。実際のJLPT N5の構成比（言語知識・読解 約72%／聴解 約28%）に準拠。'
  };
  $('json').textContent = JSON.stringify(rec, null, 2);
  $('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(rec, null, 2));
      toast('コピーしました');
    } catch { toast('長押しで選択してコピーしてください'); }
  };
  window.scrollTo(0, 0);
}

$('again').onclick = () => {
  $('result').classList.add('hide');
  $('start').classList.remove('hide');
  window.scrollTo(0, 0);
};

// ---------- PWA ----------
if ('serviceWorker' in navigator){
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
