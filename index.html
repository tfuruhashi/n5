<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>Yappanese N5 判定テスト</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--navy:#1f3864;--ink:#1a1a1a;--sub:#6b7280;--line:#e5e7eb;
      --soft:#f7f8fa;--ok:#1e6b38;--okbg:#e6f4ea;--ng:#9b2c2c;--ngbg:#fdeaea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
     color:var(--ink);line-height:1.75;font-size:17px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.hide{display:none!important}
h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
.lead{color:var(--sub);font-size:14px;margin:0 0 22px}
label{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px}
input{width:100%;padding:14px;font:inherit;border:1px solid var(--line);
      border-radius:10px;background:var(--soft)}
input:focus{outline:2px solid var(--navy);outline-offset:-1px}
input.code{text-transform:uppercase;letter-spacing:2px;font-weight:600}
button{font:inherit;cursor:pointer;border:none;border-radius:10px}
.btn{width:100%;padding:16px;background:var(--navy);color:#fff;
     font-weight:600;font-size:17px;margin-top:20px}
.btn:disabled{opacity:.35;cursor:default}
.btn.sub{background:#fff;color:var(--navy);border:1px solid var(--navy);
         padding:12px;font-size:15px;margin-top:10px}
.bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.bar>i{display:block;height:100%;background:var(--navy);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:20px}
.tag{background:var(--soft);padding:2px 10px;border-radius:99px;font-size:12px}
.passage{background:var(--soft);border-radius:12px;padding:16px;margin-bottom:18px;
         white-space:pre-wrap;font-size:16px}
.qtext{font-size:19px;font-weight:600;margin:0 0 20px;line-height:1.8}
.qtext u{text-decoration:none;border-bottom:3px solid var(--navy);padding-bottom:1px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;
        background:#fff;border:1.5px solid var(--line);border-radius:12px;
        font-size:17px;color:var(--ink)}
.choice.sel{border-color:var(--navy);background:#eef2fa}
.choice .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);
           color:var(--sub);display:grid;place-items:center;font-size:14px;font-weight:600}
.choice.sel .n{background:var(--navy);color:#fff}
.audio{background:#eef2fa;border:1px solid #c9d5ea;border-radius:12px;
       padding:18px;text-align:center;margin-bottom:18px}
.play{margin-top:10px;padding:12px 26px;background:var(--navy);color:#fff;
      font-size:16px;font-weight:600}
.play:disabled{opacity:.4}
.left{font-size:13px;color:var(--sub);margin-top:8px}
.score{text-align:center;padding:28px 0 20px}
.score .n{font-size:56px;font-weight:700;line-height:1;color:var(--navy)}
.score .d{font-size:15px;color:var(--sub);margin-top:6px}
.verdict{display:inline-block;margin-top:16px;padding:10px 28px;border-radius:99px;
         font-weight:700;font-size:18px}
.verdict.p{background:var(--okbg);color:var(--ok)}
.verdict.f{background:var(--ngbg);color:var(--ng)}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:22px}
.row{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
     font-size:14px;align-items:flex-start}
.row:last-child{border-bottom:none}
.row .i{flex:0 0 22px;font-weight:700}
.row.o .i{color:var(--ok)}.row.x .i{color:var(--ng)}
.row .t{flex:1;min-width:0}
.row .t small{color:var(--sub);display:block;margin-top:2px}
.note{font-size:13px;color:var(--sub);margin-top:22px;background:var(--soft);
      padding:14px;border-radius:10px}
.err{background:var(--ngbg);color:var(--ng);padding:12px;border-radius:10px;
     font-size:14px;margin-top:14px}
.inst{background:#eef2fa;border:1px solid #c9d5ea;border-radius:10px;
      padding:12px 14px;font-size:14px;margin-top:10px}
.inst b{color:var(--navy)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
       background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;
       font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.instr{background:#eef2fa;border:1px solid #c9d5ea;border-radius:10px;
       padding:10px 14px;font-size:13px;color:var(--navy);margin-bottom:14px}
.linkbar{text-align:center;margin-top:26px;font-size:13px}
.linkbar a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 機関コードの入力 ============ -->
<section id="s-code">
  <h1>N5 判定テスト</h1>
  <p class="lead">学校から渡されたコードを入れてください<br>
    <span style="font-size:13px">Enter the code given by your school</span></p>

  <label for="code">学校のコード / School code</label>
  <input type="text" id="code" class="code" placeholder="TEST01" autocapitalize="characters">
  <div id="codeErr" class="err hide"></div>
  <div id="instBox" class="inst hide"></div>
  <button class="btn" id="chk">つぎへ / Next</button>
</section>

<!-- ============ 受験者情報 ============ -->
<section id="s-name" class="hide">
  <h1>受験者の情報</h1>
  <p class="lead" id="instName"></p>

  <label for="name">名前 / Name<span style="color:#c00">*</span></label>
  <input type="text" id="name" placeholder="Ram Bahadur" autocomplete="name">

  <label for="nat">国籍 / Nationality</label>
  <input type="text" id="nat" placeholder="Nepal">

  <label for="birth">生年月日 / Date of birth</label>
  <input type="date" id="birth">

  <div class="note">
    <b>この形式について</b><br>
    実際のJLPT N5の構成比に準拠しています。<br>
    ・文字語彙 3問／文法 2問／読解 2問／<b>聴解 3問</b><br>
    ・合格ライン <b>5問</b>正解<br>
    聴解は音が出ます。音量を確認してください。
  </div>
  <button class="btn" id="go">はじめる / Start</button>
  <button class="btn sub" id="back">コードを入れ直す</button>
</section>

<!-- ============ 出題 ============ -->
<section id="s-quiz" class="hide">
  <div class="bar"><i id="prog"></i></div>
  <div class="meta"><span id="count"></span><span class="tag" id="kind"></span></div>
  <div class="instr" id="instr"></div>
  <div id="audioBox" class="audio hide">
    <div style="font-size:28px">🔊</div>
    <button class="play" id="play">音声を聞く</button>
    <div class="left" id="leftTxt"></div>
  </div>
  <div id="passage" class="passage hide"></div>
  <p class="qtext" id="qtext"></p>
  <div class="choices" id="choices"></div>
  <button class="btn" id="next" disabled>つぎへ / Next</button>
</section>

<!-- ============ 結果 ============ -->
<section id="s-result" class="hide">
  <h1>結果</h1>
  <p class="lead" id="who"></p>
  <div class="score">
    <div class="n"><span id="sc">0</span>
      <span style="font-size:26px;color:#9aa3af">/ 10</span></div>
    <div class="d">正答数</div>
    <div class="verdict" id="verdict"></div>
  </div>
  <div class="rows" id="rows"></div>
  <div id="saveMsg" class="note"></div>
  <button class="btn sub" id="again">最初から</button>
</section>

<div class="linkbar"><a href="admin.html">学校の方はこちら（管理画面）</a></div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const KIND = {vocab:'文字・語彙', grammar:'文法', reading:'読解', listening:'聴解'};
const DIST = {vocab:3, grammar:2, reading:2, listening:3};

// 問題の「sub」種別ごとの指示文（JLPTの指示文形式に合わせる）
const INSTR = {
  '漢字読み':   '下線の言葉の正しい読み方を選んでください。',
  '表記':       '下線の言葉を漢字で書くとき、最も良いものを選んでください。',
  '文脈規定':   '（　）に入る最も良い言葉を選んでください。',
  '言い換え':   '下線の言葉と意味が最も近いものを選んでください。',
  '助詞':       '（　）に入る最も良い言葉を選んでください。',
  '文型':       '（　）に入る最も良い言葉を選んでください。',
  '活用':       '（　）に入る最も良い言葉を選んでください。',
  '文の組み立て': '（　）に入る最も良い言葉を選んでください。',
  '短文':       '文章を読んで、質問に最も合う答えを選んでください。',
  '情報検索':   '文章を読んで、質問に最も合う答えを選んでください。',
  '課題理解':   '話を聞いて、質問に最も合う答えを選んでください。',
  '発話表現':   'イラスト・場面に最も合う言い方を選んでください。',
  '即時応答':   '最も良い返事を選んでください。',
  'ポイント理解': '話を聞いて、質問に最も合う答えを選んでください。',
};

let POOL = [], quiz = [], idx = 0, picked = null, plays = 0, answers = [];
let inst = null;   // {id, name, code}

fetch('questions.json').then(r => r.json()).then(d => POOL = d.questions)
  .catch(() => toast('問題の読み込みに失敗しました'));

function toast(m){
  $('toast').textContent = m; $('toast').classList.add('on');
  setTimeout(() => $('toast').classList.remove('on'), 1900);
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// 問題データは正解が常に0番のため、選択肢のシャッフルは必須
function build(){
  const out = [];
  for (const [t, n] of Object.entries(DIST))
    out.push(...shuffle(POOL.filter(q => q.type === t)).slice(0, n));
  return shuffle(out).map(q => {
    const sh = shuffle(q.choices.map((c, i) => ({c, ok: i === q.answer})));
    return {...q, choices: sh.map(p => p.c), answer: sh.findIndex(p => p.ok)};
  });
}

// ---------- 機関コードの確認 ----------
$('chk').onclick = async () => {
  const code = $('code').value.trim().toUpperCase();
  $('codeErr').classList.add('hide');
  $('instBox').classList.add('hide');
  if (!code) { toast('コードを入れてください'); return; }
  $('chk').disabled = true;
  try {
    // 受験時は未ログインのため、コードによる照会用の関数を使う
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/find_institution`, {
      method: 'POST',
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
                'Content-Type': 'application/json'},
      body: JSON.stringify({p_code: code}),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'エラー');
    if (!d || !d.length) {
      $('codeErr').textContent = 'このコードの学校が見つかりません。学校に確認してください。';
      $('codeErr').classList.remove('hide');
      return;
    }
    inst = d[0];
    $('instBox').innerHTML = `<b>${inst.name}</b>`;
    $('instBox').classList.remove('hide');
    setTimeout(() => {
      $('s-code').classList.add('hide');
      $('s-name').classList.remove('hide');
      $('instName').textContent = inst.name;
    }, 500);
  } catch (e) {
    $('codeErr').textContent = '接続できません。通信環境を確認してください。';
    $('codeErr').classList.remove('hide');
  } finally { $('chk').disabled = false; }
};

$('back').onclick = () => {
  $('s-name').classList.add('hide'); $('s-code').classList.remove('hide');
};

// ---------- 開始 ----------
$('go').onclick = () => {
  if (!$('name').value.trim()) { toast('名前を入れてください'); return; }
  if (!POOL.length) { toast('問題を読み込み中です'); return; }
  quiz = build(); idx = 0; answers = [];
  $('s-name').classList.add('hide'); $('s-quiz').classList.remove('hide');
  render();
};

function render(){
  const q = quiz[idx]; picked = null; plays = 0;
  $('prog').style.width = (idx / quiz.length * 100) + '%';
  $('count').textContent = `問 ${idx + 1} / ${quiz.length}`;
  $('kind').textContent = KIND[q.type];
  $('instr').textContent = INSTR[q.sub] || '最も良い答えを選んでください。';

  if (q.type === 'listening'){
    $('audioBox').classList.remove('hide');
    $('play').disabled = false; $('leftTxt').textContent = '2回まで聞けます';
  } else { $('audioBox').classList.add('hide'); speechSynthesis.cancel(); }

  if (q.passage){ $('passage').classList.remove('hide'); $('passage').textContent = q.passage; }
  else $('passage').classList.add('hide');

  let t = q.q;
  if (q.underline) t = t.replace(q.underline, `<u>${q.underline}</u>`);
  $('qtext').innerHTML = t;

  $('choices').innerHTML = '';
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="n">${i + 1}</span><span>${c}</span>`;
    b.onclick = () => {
      picked = i;
      [...$('choices').children].forEach((e, j) => e.classList.toggle('sel', j === i));
      $('next').disabled = false;
    };
    $('choices').appendChild(b);
  });
  $('next').disabled = true;
  $('next').textContent = (idx === quiz.length - 1) ? '結果を見る / Finish' : 'つぎへ / Next';
  window.scrollTo(0, 0);
}

$('play').onclick = () => {
  if (plays >= 2) return;
  plays++;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(quiz[idx].audio);
  u.lang = 'ja-JP'; u.rate = 0.85;
  u.onend = () => {
    $('leftTxt').textContent = plays >= 2 ? '再生は終わりです' : 'あと1回聞けます';
    $('play').disabled = plays >= 2;
  };
  $('play').disabled = true; $('leftTxt').textContent = '再生中…';
  speechSynthesis.speak(u);
};

$('next').onclick = () => {
  const q = quiz[idx];
  answers.push({id:q.id, type:q.type, sub:q.sub, picked,
                correct: picked === q.answer,
                chosen: q.choices[picked], right: q.choices[q.answer]});
  speechSynthesis.cancel();
  idx++;
  if (idx < quiz.length) render(); else finish();
};

// ---------- 結果とDB保存 ----------
async function finish(){
  const n = answers.filter(a => a.correct).length;
  const pass = n >= PASS_MARK;

  $('s-quiz').classList.add('hide'); $('s-result').classList.remove('hide');
  $('who').textContent = `${$('name').value.trim()}　${inst.name}`;
  $('sc').textContent = n;
  $('verdict').textContent = pass ? '合格 / Pass' : '不合格 / Not yet';
  $('verdict').className = 'verdict ' + (pass ? 'p' : 'f');

  $('rows').innerHTML = '';
  answers.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'row ' + (a.correct ? 'o' : 'x');
    d.innerHTML = `<span class="i">${a.correct ? '○' : '×'}</span>
      <span class="t">${i + 1}. ${KIND[a.type]}（${a.sub}）
      ${a.correct ? '' : `<small>正解：${a.right}／選択：${a.chosen}</small>`}</span>`;
    $('rows').appendChild(d);
  });

  const breakdown = Object.fromEntries(Object.keys(DIST).map(k => {
    const g = answers.filter(a => a.type === k);
    return [KIND[k], `${g.filter(a => a.correct).length}/${g.length}`];
  }));

  $('saveMsg').textContent = '結果を学校に送信しています…';
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_result`, {
      method: 'POST',
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY,
                'Content-Type': 'application/json'},
      body: JSON.stringify({
        p_code: inst.code,
        p_name: $('name').value.trim(),
        p_nationality: $('nat').value.trim() || null,
        p_birth: $('birth').value || null,
        p_tool: TOOL_NAME,
        p_total: quiz.length,
        p_correct: n,
        p_pass_mark: PASS_MARK,
        p_passed: pass,
        p_breakdown: breakdown,
        p_details: answers.map((a, i) => ({
          no: i + 1, id: a.id, type: KIND[a.type], sub: a.sub, correct: a.correct
        })),
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    $('saveMsg').innerHTML =
      '<b>送信しました。</b>学校の管理画面から結果を確認できます。';
  } catch (e) {
    $('saveMsg').innerHTML =
      '<b style="color:#9b2c2c">送信できませんでした。</b>' +
      'この画面を学校の担当者に見せてください。<br>' +
      `<small>${String(e).slice(0, 120)}</small>`;
  }
  window.scrollTo(0, 0);
}

$('again').onclick = () => location.reload();

if ('serviceWorker' in navigator)
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
