<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本語能力確認記録書</title>
<style>
:root{--ink:#111;--sub:#666;--line:#333;--soft:#f4f5f7}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
     color:var(--ink);line-height:1.8;font-size:14px;background:#eceff3}
.sheet{width:210mm;min-height:297mm;margin:20px auto;background:#fff;
       padding:18mm 16mm;box-shadow:0 2px 12px rgba(0,0,0,.12)}
h1{font-size:19px;text-align:center;margin:0 0 4px;letter-spacing:3px}
.sub{text-align:center;font-size:11px;color:var(--sub);margin:0 0 22px}
h2{font-size:13px;margin:22px 0 8px;padding-left:8px;
   border-left:4px solid var(--line);letter-spacing:1px}
table{width:100%;border-collapse:collapse;margin-bottom:4px}
th,td{border:1px solid var(--line);padding:7px 10px;font-size:13px;
      vertical-align:middle}
th{background:var(--soft);width:32%;text-align:left;font-weight:600}
td.c{text-align:center}
.big{font-size:17px;font-weight:700}
.verdict{font-size:20px;font-weight:700;letter-spacing:4px}
.q{width:100%;border-collapse:collapse}
.q th,.q td{border:1px solid var(--line);padding:5px 4px;text-align:center;
            font-size:12px}
.q th{background:var(--soft);font-weight:600}
.q .o{color:#1e6b38;font-weight:700}
.q .x{color:#9b2c2c;font-weight:700}
.note{font-size:11px;color:var(--sub);line-height:1.9;margin-top:14px;
      border:1px solid #ccc;padding:11px 13px;background:#fafafa}
.sign{margin-top:26px}
.sign table th{width:24%}
.sign .fill{height:34px}
.bar{max-width:210mm;margin:0 auto;padding:0 0 8px;display:flex;gap:10px;
     justify-content:flex-end}
button{font:inherit;font-family:sans-serif;padding:10px 20px;border:none;
       border-radius:8px;background:#1f3864;color:#fff;cursor:pointer;font-size:14px}
button.sub{background:#fff;color:#1f3864;border:1px solid #1f3864}
@media print{
  body{background:#fff}
  .sheet{margin:0;box-shadow:none;width:auto;min-height:auto;padding:12mm}
  .bar{display:none}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<div class="bar">
  <button class="sub" onclick="window.close()">閉じる</button>
  <button onclick="window.print()">印刷 / PDFで保存</button>
</div>

<div class="sheet" id="sheet">
  <h1>日本語能力確認記録書</h1>
  <p class="sub">
    在留資格「留学」に係る日本語能力の確認記録<br>
    Record of Japanese Language Proficiency Assessment
  </p>

  <h2>1. 受験者</h2>
  <table>
    <tr><th>氏名</th><td class="big" id="name">—</td></tr>
    <tr><th>国籍</th><td id="nat">—</td></tr>
    <tr><th>生年月日</th><td id="birth">—</td></tr>
  </table>

  <h2>2. 実施機関</h2>
  <table>
    <tr><th>機関名</th><td id="inst">—</td></tr>
    <tr><th>所在地</th><td id="addr">—</td></tr>
    <tr><th>実施場所</th><td id="place">—</td></tr>
    <tr><th>確認実施者</th><td id="interviewer">—</td></tr>
  </table>

  <h2>3. 確認の方法</h2>
  <table>
    <tr><th>使用した評価ツール</th><td id="tool">—</td></tr>
    <tr><th>実施日時</th><td id="at">—</td></tr>
    <tr><th>出題数</th><td class="c big" id="total">—</td></tr>
    <tr><th>正答数</th><td class="c big" id="correct">—</td></tr>
    <tr><th>合否基準</th><td id="mark">—</td></tr>
    <tr><th>判定</th><td class="c verdict" id="verdict">—</td></tr>
  </table>

  <h2>4. 分野別の内訳</h2>
  <table id="bdTable"><tbody id="bd"></tbody></table>

  <h2>5. 各問の正誤</h2>
  <table class="q">
    <thead><tr id="qh"></tr></thead>
    <tbody><tr id="qk"></tr><tr id="qr"></tr></tbody>
  </table>

  <div class="note" id="note"></div>

  <div class="sign">
    <h2>6. 確認者の署名</h2>
    <table>
      <tr><th>役職・氏名</th><td class="fill"></td></tr>
      <tr><th>確認日</th><td class="fill"></td></tr>
      <tr><th>備考</th><td class="fill"></td></tr>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const r = JSON.parse(localStorage.getItem('yp_record') || 'null');

if (!r) {
  document.getElementById('sheet').innerHTML =
    '<p style="text-align:center;padding:60px">記録が見つかりません。'
    + '<br>管理画面から「記録書」を押してください。</p>';
} else {
  const d = new Date(r.tested_at);
  const pad = n => String(n).padStart(2, '0');

  $('name').textContent = r.examinee_name || '—';
  $('nat').textContent = r.nationality || '（未記入）';
  $('birth').textContent = r.birth_date || '（未記入）';
  $('inst').textContent = r.institution_name || '—';
  $('addr').textContent = r.institution_address || '（未記入）';
  $('place').textContent = r.place || r.institution_name || '（未記入）';
  $('interviewer').textContent = r.interviewer || '（署名欄に記入）';
  $('tool').textContent = r.tool || '—';
  $('at').textContent =
    `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 `
    + `${pad(d.getHours())}時${pad(d.getMinutes())}分`;
  $('total').textContent = `${r.total} 問`;
  $('correct').textContent = `${r.correct} 問`;
  $('mark').textContent = `${r.total}問中 ${r.pass_mark}問以上の正答をもって合格とする`;
  $('verdict').textContent = r.passed ? '合　格' : '不合格';

  // 分野別
  const bd = r.breakdown || {};
  $('bd').innerHTML = Object.entries(bd)
    .map(([k, v]) => `<tr><th>${k}</th><td class="c">${v}</td></tr>`).join('')
    || '<tr><th>—</th><td class="c">—</td></tr>';

  // 各問
  const det = r.details || [];
  $('qh').innerHTML = '<th>問</th>' + det.map(x => `<th>${x.no}</th>`).join('');
  $('qk').innerHTML = '<th>分野</th>'
    + det.map(x => `<td style="font-size:10px">${x.type || ''}</td>`).join('');
  $('qr').innerHTML = '<th>正誤</th>'
    + det.map(x => `<td class="${x.correct ? 'o' : 'x'}">${x.correct ? '○' : '×'}</td>`).join('');

  $('note').innerHTML = `
    <b>本記録書について</b><br>
    ・出入国在留管理庁の通知により、在留資格「留学」の申請において、
      日本語能力の証明は指定された試験の合格証明書または受入機関による面接記録によることとされている。
      本記録書は後者にあたる。<br>
    ・入管の示す確認方法の例は「試験の問題又はその同等レベルの問題を10問出題し、
      正答率に照らして確認する」ものであり、本記録はこれに準拠している。<br>
    ・使用した評価ツールはJLPT公式問題ではなく、
      JLPT N5の出題形式・難易度・構成比（言語知識・読解 約72%／聴解 約28%）に準拠して
      作成した自作の評価ツールである。<br>
    ・<b>本記録書の作成主体は上記の実施機関であり、確認は同機関の職員が実施したものである。</b><br>
    ・各種確認書への転記に用いること。`;

  document.title =
    `日本語能力確認記録書_${r.examinee_name}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
}
</script>
</body>
</html>
